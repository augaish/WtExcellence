        method: "SIPOC"
      complete_inputs:
        title: "أكمل المدخلات"
        why: "نقص المدخلات يضعف قابلية التنفيذ والضبط."
        action: "سمِّ مدخلًا لكل مهمة رئيسية."
        method: "SIPOC / ISO 9001"
      complete_outputs:
        title: "أكمل المخرجات"
        why: "المخرج هو الدليل على اكتمال الإجراء."
        action: "سمِّ المخرج النهائي ومخرجات الخطوات الحرجة."
        method: "SIPOC / QMS"
      complete_performers:
        title: "أكمل المنفذ لكل عنصر"
        why: "غياب المنفذ يضعف المساءلة ودقة المسارات."
        action: "عيّن منفذًا لكل خطوة وحدث: دور أو إدارة أو نظام أو طرف خارجي."
        method: "RACI"
      improve_descriptions:
        title: "حسّن أوصاف الخطوات"
        why: "الأوصاف المختصرة تفيد التدقيق والتدريب ونقل المعرفة."
        action: "أضف وصفًا عمليًا لما يحدث ومعيار الاكتمال."
        method: "ISO 9001 Documentation"
      label_gateways:
        title: "سمِّ مخرجات البوابات"
        why: "البوابات غير المسماة تخفي منطق القرار."
        action: "اكتب شروط المسارات مثل نعم/لا أو مكتمل/غير مكتمل أو مقبول/مرفوض."
        method: "BPMN 2.0 Gateways"
      reduce_handoffs:
        title: "قلّل التسليمات بين الأدوار"
        why: "كثرة التسليمات تزيد زمن الدورة ومخاطر الضياع."
        action: "ادمج الخطوات المتتالية المتشابهة أو أعد توزيعها لتقليل نقاط التسليم."
        method: "Lean Handoffs"
      raise_automation:
        title: "ارفع الجاهزية للأتمتة"
        why: "ارتفاع نسبة الخطوات اليدوية يزيد الأخطاء والتأخير."
        action: "حوّل خطوات التسجيل والإشعار والتحقق المتكررة إلى مهام مستخدم أو نظام أو قواعد عمل."
        method: "Digital Transformation"
      add_records:
        title: "أضف الوثائق والسجلات ذات العلاقة"
        why: "تحتاج الإجراءات المؤسسية إلى أدلة ومراجع قابلة للتدقيق."
        action: "أضف كائن بيانات للنموذج المستخدم، ومخزن بيانات للسجل أو قاعدة البيانات."
        method: "ISO 9001 / Records"
      review_participants:
        title: "راجع عدد المشاركين"
        why: "كثرة المشاركين تصعّب الحوكمة."
        action: "ادمج الأدوار المتقاربة أو افصل إجراءً فرعيًا للجزء المتخصص."
        method: "Process Architecture"
      maintain_quality:
        title: "حافظ على الجودة الحالية"
        why: "الإجراء متوازن بين BPMN والتوثيق والحوكمة."
        action: "انتقل إلى مراجعة زمن الدورة واتفاقية الخدمة والمخاطر ومصفوفة الاعتماد."
        method: "Continuous Improvement"
