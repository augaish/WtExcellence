        capa_management:
          title: إدارة CAPA والإجراءات التصحيحية
          body: تسجيل عدم المطابقة وتتبع الإجراءات التصحيحية والوقائية ومراقبة التقدم
            من تحديد المشكلة إلى الإغلاق — مع إمكانية التتبع الكامل للتدقيق.
        evidence_library:
          title: مكتبة الأدلة والوثائق المركزية
          body: تخزين وتصنيف وإعادة استخدام الأدلة عبر المعايير والبنود و CAPAs، مما
            يضمن أن الوثائق متاحة دائماً وجاهزة للتدقيق.
        role_workflows:
          title: سير العمل والصلاحيات حسب الدور
          body: تجارب مخصصة لمديري الجودة والمدققين والمكلفين — لضمان رؤية وتحرير
            واعتماد المعلومات الصحيحة من قبل الأشخاص المناسبين.
        multi_standard_versions:
          title: إدارة المعايير المتعددة والإصدارات
          body: دعم ISO و EFQM و KAQA والمعايير المخصصة في وقت واحد، مع مقارنة الإصدارات
            والنشر المتحكم به عبر المؤسسات.
        ai_continuous_improvement:
          title: رؤى الذكاء الاصطناعي والتحسين المستمر
          body: تلقي رؤى مولدة بالذكاء الاصطناعي تسلط الضوء على الفجوات وفرص التحسين
            واتجاهات الأداء بمجرد اكتمال التقييمات.
        executive_visibility:
          title: لوحات المعلومات والرؤية التنفيذية
          body: مقاييس عالية المستوى وملخصات مرئية تساعد القيادة على فهم حالة الامتثال
            والمخاطر والتقدم في لمحة.
        risk_management:
          title: "إدارة المخاطر"
          body: "سجّل وقيّم وتتبع مخاطر المؤسسة على مصفوفة احتمالية/تأثير 5×5، مجمعة في مساحات عمل حسب الإطار أو القسم."
        trust_center:
          title: "مركز الثقة"
          body: "شارك صفحة امتثال عامة تعرض المعايير التي تلتزم بها ونسبة الامتثال الحية — مصممة لبناء ثقة العملاء."
        vendor_risk:
          title: "مخاطر الأطراف الثالثة"
          body: "تتبع مستويات مخاطر الموردين وملكيتهم وفئاتهم عبر منظومة الأطراف الثالثة بأكملها في سجل واحد."
    ai_insights:
      title: رؤى الذكاء الاصطناعي، وليس مجرد الامتثال
      subtitle: يحلل ذكاؤنا الاصطناعي أنماط التقييم ونقاط التحقق غير المكتملة ونتائج
        CAPA لتسليط الضوء على أماكن التحسينات التي سيكون لها أكبر تأثير.
      features:
        improvement_insights: رؤى تحسين مولدة بالذكاء الاصطناعي
        performance_trends: اتجاهات الأداء عبر المعايير
        risk_gap_visibility: رؤية المخاطر والفجوات قبل التدقيق
      dashboard:
        title: الاستبيان
        auditor_name: محمد أحمد
        auditor_label: 'المدقق: %{name}'
        analyze: تحليل بالذكاء الاصطناعي
        table:
          question: السؤال
          answer: الإجابة
      five_whys:
        q1:
          q: لماذا كانت شهادات المطابقة مفقودة من الشحنة؟
          a: لم يقم المورد بتضمين الشهادات عند التسليم
        q2:
          q: لماذا لم يقم المورد بتضمين الشهادات؟
          a: عملية التوثيق الداخلية للمورد لا تتطلب الشهادات بشكل افتراضي
        q3:
          q: لماذا لا تفرض عملية المورد التوثيق؟
          a: لم يتم إبلاغ المورد بالتحديث الأخير لمراقبة الجودة الذي يتطلب شهادات
            إلزامية
        q4:
          q: لماذا لم يتم إبلاغ المورد بالمتطلبات المحدثة؟
          a: لم يرسل فريق المشتريات إشعاراً رسمياً بعد التغيير
        q5:
          q: لماذا لم يتم اتباع خطة الاتصال؟
          a: لا يوجد نظام سير عمل آلي أو تذكير لإخطار تحديثات السياسات
      root_cause:
        title: ملخص السبب الجذري
        body: السبب الجذري هو غياب نظام سير عمل آلي لضمان إبلاغ تحديثات سياسة المشتريات
          للموردين بشكل صحيح. أدى هذا إلى سلسلة من الإخفاقات نتج عنها فقدان شهادات
          المطابقة.
