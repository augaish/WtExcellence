      title: موثوق به من محترفي الجودة
      subtitle: شاهد كيف يحقق مديرو الجودة التميز مع رؤى مدعومة بالذكاء الاصطناعي
      quotes:
        q1: '"لقد غيّر تحليل السبب الجذري المدعوم بالذكاء الاصطناعي طريقة تعاملنا
          مع عدم المطابقة. قللنا وقت دورة CAPA بنسبة 40%."'
        q2: '"أخيراً، منصة تفهم امتثال ISO 9001. وفر لنا تحليل الفجوات الآلي أسابيع
          من العمل اليدوي."'
        q3: '"ساعدتنا الرؤى التنبؤية في تحديد نتائج التدقيق المحتملة قبل أن يفعل ذلك
          جهة الاعتماد. تغيير جذري."'
        q4: '"كان التكامل مع أنظمتنا الحالية سلساً. كان الفريق جاهزاً للعمل خلال أسبوع
          مع الحد الأدنى من التدريب."'
      authors:
        a1: سارة أحمد، مديرة الجودة، شركة التقنية الطبية
        a2: محمد الرشيد، مدير نظام إدارة الجودة، شركة قطع الغيار
        a3: د. ليلى حسن، نائب رئيس الجودة، شركة الأدوية
        a4: خالد العمري، مدير تقنية المعلومات، شركة الفضاء
    faq:
      title: الأسئلة الشائعة
      toggle:
        expand: توسيع
        collapse: طي
      items:
        q1:
          q: ما هي معايير الجودة التي يدعمها WTE Excellence؟
          a: يدعم WTE Excellence معايير EFQM و ISO 9001 و KAQA و Malcolm Baldrige
            وأكثر من 20 إطار جودة آخر. يتكيف ذكاؤنا الاصطناعي مع متطلبات المعايير
            المحددة ومعايير التقييم .
        q2:
          q: كيف يعمل نظام CAPA المدعوم بالذكاء الاصطناعي؟
          a: يحلل ذكاؤنا الاصطناعي بيانات الجودة ، ويحدد الأسباب الجذرية، ويقترح إجراءات
            تصحيحية بناءً على أفضل الممارسات والبيانات التاريخية لمؤسستك.
        q3:
          q: هل يمكن للنظام التعامل مع تحليل المستندات للامتثال؟
          a: نعم، يمكن لذكائنا الاصطناعي تحليل المستندات واستخراج معلومات الامتثال
            الرئيسية وتحديد الفجوات مقارنة بمعايير الجودة التي اخترتها.
        q4:
          q: ما نوع فرص التحسين التي يقترحها الذكاء الاصطناعي؟
          a: يحدد الذكاء الاصطناعي الأنماط في بياناتك، ويقترح تحسينات العمليات، ويسلط
            الضوء على احتياجات التدريب، ويوصي بإجراءات وقائية بناءً على معايير الصناعة.
