      subtitle: "Automate EFQM, ISO 9001, and KAQA compliance with intelligent workflows that track progress, manage CAPA, and surface improvement opportunities — all in one platform."
      features:
        iso_clarity: "Implement ISO & regulatory standards with clarity"
        track_evidence: "Track evidence, audits, and corrective actions in one place"
        audit_ready: "Stay audit-ready with real-time insights"
