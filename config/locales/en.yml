    features:
      title: "Everything You Need to Run Quality Management with Confidence"
      subtitle: "A single platform to manage standards, evaluations, evidence, and corrective actions — built for quality teams, auditors, and leadership."
      cards:
        compliance_automation:
          title: "AI-Driven Compliance Automation"
          body: "Automate complex standards and clause structures while AI assists with mapping, summaries, and evidence suggestions — reducing manual effort and errors."
        performance_scoring:
          title: "Real-Time Performance & Scoring Tools"
          body: "Evaluate clauses using RADAR, custom scoring models, or simple yes/no criteria, with clear dashboards showing progress and compliance at every level."
        capa_management:
          title: "CAPA & Corrective Action Management"
          body: "Log non-conformities, track corrective and preventive actions, and monitor progress from issue identification to closure — all with full audit traceability."
        evidence_library:
          title: "Centralized Evidence & Document Library"
          body: "Store, categorize, and reuse evidence across standards, clauses, and CAPAs, ensuring documentation is always accessible and audit-ready."
        role_workflows:
          title: "Role-Based Workflows & Permissions"
          body: "Tailored experiences for Quality Managers, Auditors, and Assignees — ensuring the right people see, edit, and approve the right information."
        multi_standard_versions:
          title: "Multi-Standard & Version Management"
          body: "Support ISO, EFQM, KAQA, and custom standards simultaneously, with version comparison and controlled rollout across organizations."
        ai_continuous_improvement:
          title: "AI Insights & Continuous Improvement"
          body: "Receive AI-generated insights highlighting gaps, improvement opportunities, and performance trends once evaluations are complete."
        executive_visibility:
          title: "Dashboards & Executive Visibility"
          body: "High-level metrics and visual summaries help leadership understand compliance status, risks, and progress at a glance."
        risk_management:
          title: "Risk Management"
          body: "Log, score, and track organizational risks on a 5x5 likelihood/impact matrix, grouped into workspaces by framework or department."
        trust_center:
          title: "Trust Center"
          body: "Share a public, branded compliance page showing which standards you meet and your live compliance percentage — built for customer trust."
        vendor_risk:
          title: "Third-Party Risk"
          body: "Track vendor risk levels, ownership, and category across your entire third-party ecosystem in one register."

    ai_insights:
      title: "AI insights, not just compliance"
      subtitle: "Our AI analyzes scoring patterns, incomplete checkpoints, and CAPA outcomes to highlight where improvements will have the highest impact."
      features:
        improvement_insights: "AI-generated improvement insights"
        performance_trends: "Performance trends across standards"
        risk_gap_visibility: "Risk and gap visibility before audits"
      dashboard:
        title: "Questionnaire"
        auditor_name: "John Doe"
        auditor_label: "Auditor: %{name}"
        analyze: "AI Analyze"
        table:
          question: "Question"
          answer: "Answer"
      five_whys:
        q1:
          q: "Why were conformity certificates missing from the shipment?"
          a: "The supplier didn't include the certificates when delivering"
        q2:
          q: "Why didn't the supplier include the certificates?"
          a: "The supplier's internal documentation process does not require certificates by default"
        q3:
          q: "Why does the supplier's process not enforce documentation?"
          a: "The supplier was not informed of the recent quality control requiring mandatory certificates"
        q4:
          q: "Why was the supplier not informed about the updated requirements?"
          a: "The procurement team did not send a formal notification after the change"
        q5:
          q: "Why wasn't the communication plan followed?"
          a: "There is no automated workflow or reminder system to notify policy updates"
      root_cause:
        title: "Root Cause Summary"
        body: "The root cause is the absence of an automated workflow system to ensure procurement policy updates are properly communicated to suppliers. This led to a chain of failures resulting in missing conformity certificates."

    standards:
      title: "Quality Standards Supported"
      subtitle: "Comprehensive support for leading quality and excellence frameworks"
      cards:
        efqm:
          description: "European Foundation for Quality Management excellence model"
          tags:
            self_assessment: "Self-assessment"
            radar_logic: "Radar logic"
            stakeholder_value: "Stakeholder value"
        iso9001:
          description: "Quality Management System international standard"
        kaqa:
          description: "King Abdullah Quality Award excellence framework"
          tags:
            systems_perspective: "Systems perspective"
            leadership: "Leadership"
            organizational_learning: "Organizational learning"
        iso27001:
          description: "Information Security Management System standard"
      common_tags:
        process_approach: "Process approach"
        risk_based_thinking: "Risk-based thinking"
        customer_focus: "Customer focus"
        continuous_improvement: "Continual improvement"
      more:
        value: "50+"
        label: "More Standards"

    testimonials:
      title: "Trusted by Quality Professionals"
      subtitle: "See how quality managers achieve excellence with AI-powered insights"
      quotes:
        q1: "\"The AI-powered root cause analysis has transformed how we approach non-conformances. We've reduced our CAPA cycle time by 40%.\""
        q2: "\"Finally, a platform that understands ISO 9001 compliance. The automated gap analysis saved us weeks of manual work.\""
        q3: "\"The predictive insights helped us identify potential audit findings before our certification body did. Game changer.\""
        q4: "\"Integration with our existing systems was seamless. The team was up and running within a week with minimal training.\""
      authors:
        a1: "Sarah Chen, Quality Director, MedTech Inc."
        a2: "Michael Roberts, QMS Manager, AutoParts Co."
        a3: "Dr. Lisa Park, VP Quality, PharmaCorp"
        a4: "James Wilson, IT Director, AeroSpace Ltd."

    faq:
      title: "Frequently Asked Questions"
      toggle:
        expand: "Expand"
        collapse: "Collapse"
      items:
        q1:
          q: "Which quality standards does WTE Excellence Support?"
          a: "WTE Excellence supports EFQM, ISO 9001, KAQA, Malcolm Baldrige, and 20+ other quality frameworks. Our AI adapts to your specific standard requirements and assessment criteria."
        q2:
          q: "How does the AI-powered CAPA system work?"
          a: "Our AI analyzes your quality data, identifies root causes, and suggests corrective actions based on best practices and your organization's historical data."
        q3:
          q: "Can the system handle document analysis for compliance?"
          a: "Yes, our AI can analyze documents, extract key compliance information, and identify gaps against your chosen quality standards."
        q4:
          q: "What kind of improvement opportunities does AI suggest?"
          a: "The AI identifies patterns in your data, suggests process optimizations, highlights training needs, and recommends preventive actions based on industry benchmarks."

