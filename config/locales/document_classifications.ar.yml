ar:
  document_classifications:
    top_secret:
      label: سري للغاية
      description: تُصنف البيانات على أنها «بيانات سرية للغاية»، إذا كان الوصول غير المصرح به إلى هذه البيانات أو الإفصاح عنها أو عن محتواها يؤدي إلى ضرر جسيم واستثنائي لا يمكن تداركه أو إصلاحه.
    secret:
      label: سري
      description: تُصنف البيانات على أنها «بيانات سرية»، إذا كان الوصول غير المصرح به إلى هذه البيانات أو الإفصاح عنها أو عن محتواها يؤدي إلى ضرر جسيم، وينطبق على المعلومات الحساسة التي تحدد طريقة عمل المؤسسة.
    internal:
      label: داخلي (مقيد)
      description: تُصنف البيانات على أنها «داخلي - مقيد»، إذا كان الوصول غير المصرح به إلى هذه البيانات أو الإفصاح عنها أو عن محتواها يؤدي إلى ضرر محدود، وتنطبق على المعلومات التي لم تتم الموافقة عليها للتداول العام خارج المؤسسة.
    public:
      label: عام
      description: تُصنف البيانات على أنها «بيانات عامة» عندما لا يترتب على الوصول غير المصرح به إلى هذه البيانات أو الإفصاح عنها أو عن محتواها أي من الآثار في التصنيفات أعلاه، وتنطبق على المعلومات التي تم التصريح بأنها معرفة عامة من قبل الشخص المخول بذلك، ويمكن منحها لأي شخص.
