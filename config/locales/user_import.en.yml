en:
  user_import:
    title: "Upload users from Excel"
    subtitle: "Invite %{company}'s users at once. Each one receives the same invitation email as a user added by hand."
    seats_line: "%{free} of %{total} licence seats are free. The template has one row per free seat."
    step1: "1. Download the template"
    step1_hint: "Role and organizational unit are dropdowns, and the sheet has exactly as many rows as there are free seats."
    step2: "2. Upload the filled-in file"
    step2_hint: "Every row is checked first. If any row has a problem, or there are more rows than free seats, nothing is saved."
    download_template: "Download template (.xlsx)"
    upload: "Upload and invite"
    no_seats: "No seats are free. Raise the licence first."
    no_file: "Choose a file first."
    no_header: "The Users sheet has no header row with Name, Email, Role."
    empty: "The sheet has no rows to import."
    too_many_rows: "The sheet has %{rows} rows but only %{free} seats are free. Remove rows or raise the licence."
    unreadable: "The file could not be read: %{error}"
    name_required: "Name is missing."
    email_invalid: "\"%{email}\" is not a valid email address."
    email_taken: "%{email} already has an account."
    email_repeated: "%{email} appears again on row %{other}."
    role_unknown: "\"%{role}\" is not a role. Pick one from the dropdown."
    unit_unknown: "\"%{unit}\" is not one of the company's organizational units."
    failed: "The file was not imported."
    nothing_saved: "Nothing was saved and no email was sent. Fix the rows above and upload again."
    row: "Row %{number}"
    done: "Invited %{count} users. %{free} seats left."
    not_permitted: "You don't have permission to invite users."
    no_company: "Company not found."
    columns:
      name: "Name"
      email: "Email"
      role: "Role"
      org_unit: "Organizational unit"
    roles:
      company_admin: "Company admin"
      company_quality_manager: "Quality manager"
      company_risk_manager: "Risk manager"
      company_auditor: "Auditor"
      company_contributor: "Contributor"
      company_viewer: "Viewer"
    help:
      - "One row per person: name, email, role and, if you like, the organizational unit they belong to."
      - "Role and unit are dropdowns. Leave the unit blank if the person has none yet."
      - "Each person gets an invitation email and sets their own password. Nobody is active until they accept."
      - "The sheet has one row per free licence seat. A file with more rows than free seats is refused."
