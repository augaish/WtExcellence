ar:
  authority_levels:
    prepare:
      label: إعداد
      description: البدء بالإجراء وإعداد الوثائق والمستندات والمعلومات ذات الصلة استعدادًا للرفع لاتخاذ القرار من قبل صاحب الصلاحية.
    review:
      label: مراجعة
      description: التحقق من صحة الإجراء ومواءمته لمتطلبات العمل، ويجب موافاة كافة المتطلبات قبل استكمال إجراءات الموافقة والاعتماد.
    approve:
      label: موافقة
      description: الموافقة المبدئية على الإجراء قبل الرفع للتوصية أو الاعتماد النهائي من قبل صاحب الصلاحية.
    recommend:
      label: توصية
      description: إبداء الرأي بعد أخذ الموافقات المبدئية اللازمة قبل الرفع للاعتماد النهائي.
    authorize:
      label: اعتماد
      description: الاعتماد النهائي للإجراء رسميًا من قبل صاحب الصلاحية.
    inform:
      label: إحاطة
      description: إحاطة المعني بالقرار النهائي الذي تم اتخاذه بشأن الإجراء، سواء بالموافقة أو عدمها.
