ar:
  user_import:
    title: "رفع المستخدمين من Excel"
    subtitle: "ادعُ مستخدمي %{company} دفعة واحدة. يتلقى كل واحد منهم رسالة الدعوة نفسها التي يتلقاها المستخدم المضاف يدويًا."
